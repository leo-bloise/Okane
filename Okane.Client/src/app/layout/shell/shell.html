<div class="flex min-h-dvh bg-surface-muted">
  <aside class="flex w-64 flex-col border-r border-border bg-surface">
    <div class="px-6 py-6">
      <span class="text-xl font-bold tracking-tight text-brand-700">Okane</span>
    </div>
    <nav class="flex-1 space-y-1 px-3">
      @for (item of menuItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-50 text-brand-700"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium hover:bg-surface-muted"
        >
          <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>
  <main class="flex-1 overflow-y-auto p-8">
    <router-outlet />
  </main>
</div>
