<div
  class="fixed inset-0 z-40 bg-black/30 transition-opacity duration-300"
  [class.opacity-100]="open()"
  [class.opacity-0]="!open()"
  [class.pointer-events-none]="!open()"
  (click)="closed.emit()"
></div>

<div
  class="fixed right-0 top-0 z-50 flex h-full w-full max-w-md flex-col bg-surface shadow-lg transition-transform duration-300 ease-out"
  [class.translate-x-0]="open()"
  [class.translate-x-full]="!open()"
>
  <div class="flex items-center justify-between border-b border-border px-6 py-4">
    <h2 class="text-lg font-semibold text-ink-900">New wallet</h2>
    <button
      type="button"
      class="text-ink-500 hover:text-ink-900"
      (click)="closed.emit()"
      aria-label="Close"
    >
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <form class="flex flex-1 flex-col gap-4 overflow-y-auto px-6 py-6" [formGroup]="form" (ngSubmit)="submit()">
    @if (formError()) {
      <div class="rounded-lg border border-danger-500/20 bg-danger-50 px-4 py-3 text-sm text-danger-600">
        {{ formError() }}
      </div>
    }

    <div>
      <label for="name" class="block text-sm font-medium text-ink-700">Name</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        class="mt-1 block w-full rounded-lg border border-border bg-surface px-3 py-2 text-sm text-ink-900 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20"
      />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <p class="mt-1 text-xs text-danger-600">
          @if (form.controls.name.errors?.['required']) {
            Name is required.
          } @else if (form.controls.name.errors?.['server']) {
            {{ form.controls.name.errors?.['server'] }}
          }
        </p>
      }
    </div>

    <button
      type="submit"
      [disabled]="submitting()"
      class="mt-2 flex w-full items-center justify-center rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ submitting() ? 'Creating…' : 'Create wallet' }}
    </button>
  </form>
</div>
